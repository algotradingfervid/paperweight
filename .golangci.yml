version: "2"

linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    forbidigo:
      # No floating point for business values (spec section 3, D-NUM-01).
      forbid:
        - pattern: ^float(32|64)$
          msg: "floating point is not allowed for business values (spec section 3, D-NUM-01); use integer types instead"
    staticcheck:
      checks:
        - all
        # golangci-lint defaults
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # User-facing sentences such as db.ErrBusy are error values by design.
        - -ST1005
  exclusions:
    rules:
      # The float rule applies only to non-test files under internal/.
      - linters: [forbidigo]
        path-except: ^internal/
      - linters: [forbidigo]
        path: _test\.go$
      # Tests convert small, bounded ints to bytes (G115), use seeded
      # generators (G404) and re-run their own binary (G204).
      - linters: [gosec]
        text: G115|G404|G204
        path: _test\.go$
